<html lang="en">
<head>

  <title>Static to S3</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f8fb;
      margin: 0;
      padding: 0;
      display: flex;

      align-items: center;
      justify-content: center;
      height: 100vh;

  <div class="container">
